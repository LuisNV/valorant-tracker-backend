spring:
  application:
    name: valorant-tracker-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tracker}
    username: ${DB_USERNAME:tracker}
    password: ${DB_PASSWORD:tracker}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  cache:
    type: caffeine
    cache-names: players
    caffeine:
      spec: maximumSize=500,expireAfterWrite=5m

henrik:
  base-url: https://api.henrikdev.xyz
  api-key: ${HENRIK_API_KEY:}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
